<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="CSS/bootstrap.min.css" />
    <link rel="stylesheet" href="CSS/style.css" />

    <title>What's For Dinner</title>
  </head>

  <body>
    <nav id="navbarid" class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <!-- Logo Section -->
        <div class="d-flex align-items-center ms-5">
          <div
            class="icon text-light rounded-circle d-flex justify-content-center align-items-center fs-5 me-3"
          >
            <i class="fa-solid fa-utensils"></i>
          </div>

          <div>
            <p class="navbar-brand mb-0">What's For Dinner</p>
            <p class="navbar-brands mb-0">Your daily meal inspiration</p>
          </div>
        </div>

        <!-- Right Links -->
        <div
          class="collapse navbar-collapse justify-content-end me-5 fs-5"
          id="navbarNavAltMarkup"
        >
          <div class="navbar-nav">
            <a class="nav-link active" href="#"
              ><i class="fa-solid fa-bookmark"></i
            ></a>
            <a class="nav-link" href="#"
              ><i class="fa-solid fa-clock-rotate-left"></i
            ></a>
            <a class="nav-link" href="#"><i class="fa-solid fa-gear"></i></a>
            <a class="nav-link">
              <div class="avatar-holder">
                <img src="images/avatar-4.jpg" alt="Avatar" />
              </div>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <div class="recipe-container container-fluid p-0">
        <div class="row p-0 shadow rounded-4">
          <!-- Left side: image -->
          <div class="left-side col-lg-5 p-0">
            <img id="recipe-img" src="images/Caprese Sandwich.avif" alt="" />

            <!-- Rating badge -->
            <div
              class="rating-badge rounded-pill px-3 py-2 d-flex align-items-center shadow-sm"
            >
              <i class="fa-solid fa-star text-warning me-2"></i>
              <span id="stars" class="fw-bold me-1">4.7</span>
              <span id="reviews" class="text-secondary"></span>
            </div>

            <!-- Prep / Cook / Servings overlay -->
            <div
              class="stats-overlay rounded-4 p-3 d-flex justify-content-around shadow-sm"
            >
              <div class="text-center">
                <div
                  class="stat-icon bg-transparent bg-main-color rounded-circle d-flex justify-content-center align-items-center mx-auto mb-1"
                >
                  <i class="fa-solid fa-clock"></i>
                </div>
                <p class="mb-0 text-secondary small">Prep Time</p>
                <p id="preptime" class="mb-0 fw-bold"></p>
              </div>

              <div class="text-center">
                <div
                  class="stat-icon bg-transparent text-danger rounded-circle d-flex justify-content-center align-items-center mx-auto mb-1"
                >
                  <i class="fa-solid fa-fire"></i>
                </div>
                <p class="mb-0 text-secondary small">Cook Time</p>
                <p id="cooktime" class="mb-0 fw-bold"></p>
              </div>

              <div class="text-center">
                <div
                  class="stat-icon bg-transparent text-primary rounded-circle d-flex justify-content-center align-items-center mx-auto mb-1"
                >
                  <i class="fa-solid fa-users"></i>
                </div>
                <p class="mb-0 text-secondary small">Servings</p>
                <p id="servings" class="mb-0 fw-bold"></p>
              </div>
            </div>
          </div>

          <!-- Right side: content -->
          <div class="right-side col-lg-7 flex-column h-100">
            <div class="p-5">
              <div
                class="d-flex justify-content-between align-items-start mb-3"
              >
                <div class="tags">
                  <span id="Tag1" class="badge rounded-pill tag-easy px-3 py-2 me-2"
                    >Easy</span
                  >
                  <span id="Tag2" class="badge rounded-pill tag-cuisine px-3 py-2"
                    >Asian</span
                  >
                </div>

                <div class="d-flex gap-2">
                  <button
                    class="icon-btn btn rounded-3 d-flex align-items-center justify-content-center"
                  >
                    <i class="fa-solid fa-bookmark"></i>
                  </button>
                  <button
                    class="icon-btn btn rounded-3 d-flex align-items-center justify-content-center"
                  >
                    <i class="fa-solid fa-share-nodes"></i>
                  </button>
                </div></div>
              <!-- Title -->
              <header class="mb-4">
                <h1 id="rname" class="fw-bold">Teriyaki Chicken Bowl</h1>
                <p id="rde" class="text-secondary fs-5 mb-0">
                  Sweet and savory chicken over rice with vegetables
                </p>
              </header>

              <!-- Tabs -->
              <ul class="nav nav-tabs justify-content-start border-0 mb-4">
                <li class="nav-item">
                  <button
                    class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#ingredients"
                    type="button"
                  >
                    <i class="fa-solid fa-list-check me-2"></i>
                    Ingredients
                  </button>
                </li>

                <li class="nav-item">
                  <button
                    class="nav-link text-secondary"
                    data-bs-toggle="tab"
                    data-bs-target="#instructions"
                    type="button"
                  >
                    <i class="fa-solid fa-book-open me-2"></i>
                    Instructions
                  </button>
                </li>

                <li class="nav-item">
                  <button
                    class="nav-link text-secondary"
                    data-bs-toggle="tab"
                    data-bs-target="#nutrition"
                    type="button"
                  >
                    <i class="fa-solid fa-chart-pie me-2"></i>
                    Nutrition
                  </button>
                </li>

                <li class="nav-item">
                  <button
                    class="nav-link text-secondary"
                    data-bs-toggle="tab"
                    data-bs-target="#tips"
                    type="button"
                  >
                    <i class="fa-solid fa-lightbulb me-2"></i>
                    Chef's Tips
                  </button>
                </li>
              </ul>

              <hr class="mt-0" />

              <div class="tab-content">
                <!-- Ingredients -->
                <div class="tab-pane fade show active" id="ingredients">
                  <div
                    class="ingredients-box p-4 recipe-scroll"
                  >
                    <ul id="ingredientsList" class="list-unstyled mb-0">
                      <li class="d-flex align-items-center mb-4">
                        <span
                          class="ingredient-number rounded-circle d-flex justify-content-center align-items-center me-3"
                          >1</span
                        >
                        <span class="fs-5"></span>
                      </li>

                    </ul>
                  </div>
                </div>

                <!-- Instructions -->
                <div
                  class="tab-pane fade" id="instructions">
                  <div id="instructionsList" class="recipe-scroll"
                >
                  
                  <div class="d-flex align-items-center mb-5">
                    <div
                      class="steps bg-main text-light fw-bold fs-4 d-flex justify-content-center align-items-center me-4"
                    >
                      1
                    </div>
                    <p class="fs-6 mb-0"></p>
                  </div>
                </div>
                </div>

                <!-- Nutrition -->
                <div class="tab-pane fade" id="nutrition"><div class="recipe-scroll">
                  <div class="container h-100">
                
                <div class="row g-4">
                  <div class="col-lg-6">
                    <div
                      class="nutrition-box d-flex justify-content-between align-items-center"
                    >
                      <div class="d-flex align-items-center">
                        <div
                          class="me-3 i-box bg-Calories txet-color-Calories text-center align-content-center"
                        >
                          <i class="fa-solid fa-fire"></i>
                        </div>

                        <div>Calories</div>
                      </div>

                      <div id="Calories" class="fw-bold fs-5"></div>
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div
                      class="nutrition-box d-flex justify-content-between align-items-center"
                    >
                      <div class="d-flex align-items-center">
                        <div
                          class="me-3 i-box bg-protin txet-color-protin text-center align-content-center"
                        >
                          <i class="fa-solid fa-dumbbell"></i>
                        </div>

                        <div>Protein</div>
                      </div>

                      <div id="Protein" class="fw-bold fs-5"></div>
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div
                      class="nutrition-box d-flex justify-content-between align-items-center"
                    >
                      <div class="d-flex align-items-center">
                        <div
                          class="me-3 i-box bg-Carbohydrates txet-color-Carbohydrates text-center align-content-center"
                        >
                          <i class="fa-solid fa-wheat-awn"></i>
                        </div>

                        <div>Carbohydrates</div>
                      </div>

                      <div id="Carbohydrates" class="fw-bold fs-5"></div>
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div
                      class="nutrition-box d-flex justify-content-between align-items-center"
                    >
                      <div class="d-flex align-items-center">
                        <div
                          class="me-3 i-box bg-Fat txet-color-Fat text-center align-content-center"
                        >
                          <i class="fa-solid fa-droplet"></i>
                        </div>

                        <div>Fat</div>
                      </div>

                      <div id="Fat" class="fw-bold fs-5"></div>
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div
                      class="nutrition-box d-flex justify-content-between align-items-center"
                    >
                      <div class="d-flex align-items-center">
                        <div
                          class="me-3 i-box bg-Fiber txet-color-Fiber text-center align-content-center"
                        >
                          <i class="fa-solid fa-seedling"></i>
                        </div>

                        <div>Fiber</div>
                      </div>

                      <div id="Fiber" class="fw-bold fs-5"></div>
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div
                      class="nutrition-box d-flex justify-content-between align-items-center"
                    >
                      <div class="d-flex align-items-center">
                        <div
                          class="me-3 i-box bg-Sodium txet-color-Sodium text-center align-content-center"
                        >
                          <i class="fa-solid fa-cube"></i>
                        </div>

                        <div>Sodium</div>
                      </div>

                      <div id="Sodium" class="fw-bold fs-5"></div>
                    </div>
                  </div>
                </div>
              </div></div>
              
                </div>
                <!-- Chef's Tips -->
                <div class="tab-pane fade" id="tips"><div id="tipsList" class="recipe-scroll">
                  <div class="d-flex tip-container p-2">
                    <div class="tip-icon rounded-circle text-center d-flex justify-content-center align-items-center me-1"><i class="fa-solid fa-check "></i></div>
                    <p></p>
                  </div>
                </div></div>
              
              

              <!-- Try Another Recipe -->
              <button
              onclick="generateRandom()"
                class="btn btn-try-another text-white rounded-3 px-4 py-2 mt-5 mb-5"              
              >
                <i class="fa-solid fa-arrows-rotate me-2"></i>Try Another Recipe
              </button>
            </div>
            
          </div>
        </div>
      </div>
    </main>
    <script src="JS/bootstrap.bundle.js"></script>
    <script src="JS/main.js"></script>
  </body>
</html>
